{% extends "base.html" %}
{% block titolo %}Impostazioni{% endblock %}
{% block contenuto %}
<h1>Impostazioni studio</h1>
<p class="muted">Dati dell'emittente riportati sulle fatture e negli export.</p>
<form class="scheda" method="post" action="/impostazioni">
  <div class="riga">
    <div class="campo"><label>Denominazione</label><input name="denominazione" value="{{ studio.denominazione }}"></div>
    <div class="campo"><label>N. iscrizione albo</label><input name="n_iscrizione_albo" value="{{ studio.n_iscrizione_albo }}"></div>
  </div>
  <div class="riga">
    <div class="campo"><label>Nome</label><input name="nome" value="{{ studio.nome }}"></div>
    <div class="campo"><label>Cognome</label><input name="cognome" value="{{ studio.cognome }}"></div>
  </div>
  <div class="riga">
    <div class="campo"><label>Codice Fiscale</label><input name="codice_fiscale" value="{{ studio.codice_fiscale }}"></div>
    <div class="campo"><label>Partita IVA</label><input name="partita_iva" value="{{ studio.partita_iva }}"></div>
  </div>
  <div class="riga">
    <div class="campo" style="flex:2 1 320px"><label>Via</label><input name="via" value="{{ studio.via }}"></div>
    <div class="campo"><label>CAP</label><input name="cap" value="{{ studio.cap }}"></div>
  </div>
  <div class="riga">
    <div class="campo"><label>Città</label><input name="citta" value="{{ studio.citta }}"></div>
    <div class="campo"><label>Prov.</label><input name="prov" value="{{ studio.prov }}" maxlength="2"></div>
  </div>
  <div class="riga">
    <div class="campo"><label>Email</label><input name="email" value="{{ studio.email }}"></div>
    <div class="campo"><label>Telefono</label><input name="telefono" value="{{ studio.telefono }}"></div>
  </div>
  <div class="riga">
    <div class="campo"><label>IBAN</label><input name="iban" value="{{ studio.iban }}"></div>
    <div class="campo"><label>Regime</label><input name="regime" value="{{ studio.regime }}"></div>
  </div>
  <div class="riga">
    <div class="campo"><label>ENPAV %</label><input name="enpav_pct" value="{{ studio.enpav_pct }}"></div>
    <div class="campo"><label>IVA default %</label><input name="iva_default_pct" value="{{ studio.iva_default_pct }}"></div>
    <div class="campo"><label>Formato numerazione</label><input name="formato_numerazione" value="{{ studio.formato_numerazione }}"></div>
  </div>
  <div class="riga">
    <div class="campo" style="flex:1 1 100%"><label>Dicitura opposizione TS</label>
      <textarea name="testo_dicitura_opposizione_ts" rows="2">{{ studio.testo_dicitura_opposizione_ts }}</textarea></div>
  </div>
  <div class="riga">
    <div class="campo" style="flex:1 1 100%"><label>Percorso logo (facoltativo)</label><input name="logo_path" value="{{ studio.logo_path }}"></div>
  </div>
  <div class="azioni"><button class="btn" type="submit">Salva</button></div>
</form>
{% endblock %}
